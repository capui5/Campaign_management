# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: com.luxasia.campaignmanagement
type: application
framework:
  name: SAPUI5
  version: 1.153.0
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        backend:
          - path: /sap
            url: http://der-otc-npr.sap.luxasia.ltd:44300
            destination: LUXASIA_S4HANA
          - path: /luxasia/oDataV4/
            url: https://luxasia-otc-npr-cf-ap11-development-luxasia-cap-dev-srv.cfapps.ap11.hana.ondemand.com/
            destination: LUXASIA_CAP
          - path: /sap/opu/odata/sap/API_SLSPRICINGCONDITIONRECORD_SRV/
            url: http://der-otc-npr.sap.luxasia.ltd:44300
            client: '200'
            destination: LUXASIA_S4HANA
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/ZSDGW_CE_APP_SRV
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
          - urlPath: /luxasia/oDataV4
            metadataPath: ./webapp/localService/oDataV4/metadata.xml
            mockdataPath: ./webapp/localService/oDataV4/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/API_SLSPRICINGCONDITIONRECORD_SRV
            metadataPath: ./webapp/localService/API_SLSPRICINGCONDITIONRECORD_SRV/metadata.xml
            mockdataPath: ./webapp/localService/API_SLSPRICINGCONDITIONRECORD_SRV/data
            generateMockData: true
        annotations:
          - localPath: ./webapp/localService/API_SLSPRICINGCONDITIONRECORD_SRV/API_SLSPRICINGCONDIT_ANNO_MDL_01.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='API_SLSPRICINGCONDIT_ANNO_MDL_01',Version='0001')/$value/
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
