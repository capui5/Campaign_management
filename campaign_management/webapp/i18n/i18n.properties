Guide_Svc_Pricing = Condition draft, validation and save via supported pricing API
Guide_Svc_Config = Approved Axxx configuration and dynamic field definitions
Guide_Svc_ValueHelp = Brand from WRF_BRANDS, customer, article and sales organization helps
Guide_Checkpoints = Developer checkpoints
Guide_Check_1 = 1. Verify actual Axxx numbers and DDIC key fields for all 20 mappings. Confirm Campaign/ID technical key equivalence.
Guide_Check_2 = 2. Confirm condition type configuration and supported S/4 pricing API, especially ZPW1 and ZCVO header discount behavior.
Guide_Check_3 = 3. Map Brand value help from WRF_BRANDS to valid hierarchy node at hierarchy L2.
Guide_Check_4 = 4. Implement server-side authorization, optimistic locking, overlapping-validity checks, duplicate protection, pricing unit/currency validation and error/retry behavior.
Guide_Check_5 = 5. Maintain Campaign-to-Condition Record linkage (including SAP KNUMH), audit trail and status; ensure Draft/Active statuses do not imply pricing is inactive unless the backend enforces it.
Guide_Check_6 = 6. Replace sample lists and browser-only draft behavior with authenticated OData V4 bindings and backend-generated campaign IDs.

