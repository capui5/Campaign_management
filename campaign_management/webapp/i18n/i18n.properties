Guide_Service = Service
Guide_Operation = Operation
Guide_Purpose = Purpose
Guide_Svc_Campaign = Campaign search: $filter, $orderby Credate desc, paging with $count / $top / $skip (CAP, read-only)
Guide_Svc_Campaign_S4 = Campaign create / change; S/4 generates the Campaign ID
Guide_Svc_Types = Active condition types with level and value kind (PRICE / AMOUNT / PERCENT)
Guide_Svc_Pricing = Campaign pricing records: POST on Add to Draft (STATUS DRAFT, overlap / duplicate checks are done here, not in the UI), PATCH to POSTED + RECORD_NUMBER or FAILED + ERROR_MESSAGE after the S/4 post, DELETE drafts
Guide_Svc_Config = Condition type / key combination matrix with business keys; PATCH CONDITION_TABLE_NUMBER, DEFAULT_FLAG, IS_ACTIVE. The UI shows "Saved successfully." or the backend error as returned
Guide_Svc_ValueHelp = Sales organization, brand, customer, article, currency and unit of measure helps (read once per session)
Guide_Svc_S4Pricing = Save to S/4: deep insert of the condition record with one to_SlsPrcgCndnRecdValidity entry; returns ConditionRecord (KNUMH)
Guide_Payload = Save to S/4 payload (A_SlsPrcgConditionRecord)
Guide_Payload_Text = ConditionTable: Axxx table number of the type / combination, else 949. ConditionApplication: V. ConditionType, ConditionRateValue (2 decimals, e.g. 100.00), ConditionRateValueUnit (% for percentage types, else the currency). ConditionCurrency: the row currency, EUR for percentage types. ConditionQuantity / ConditionQuantityUnit: pricing unit and UoM for price types, else 1 / PC. to_SlsPrcgCndnRecdValidity: ConditionValidityStartDate, ConditionValidityEndDate (/Date(ms)/), then the business keys of the combination mapped by S4_FIELD: SalesOrganization, DistributionChannel, Customer, Material, ZZCAMPAIGN.
Guide_Errors = Error handling
Guide_Errors_Text = CAP calls (util/capService.js) read OData V4 error bodies (error.message and details) and show them as returned. When an HTML page comes back instead of JSON (approuter / IdP login page after the session expired, or a proxy error page), the UI reports "Your session has expired or you are not logged in. Reload the page (F5) and try again." or the HTTP status, instead of a JSON parse error. S/4 (OData V2) errors are read from innererror.errordetails. The CSRF token is fetched on the first write and refetched once on 403 "Required".
Guide_Checkpoints = Developer checkpoints
Guide_Check_1 = 1. Verify actual Axxx numbers and DDIC key fields for all 20 mappings. Confirm Campaign/ID technical key equivalence.
Guide_Check_2 = 2. Confirm condition type configuration and supported S/4 pricing API, especially ZPW1 and ZCVO header discount behavior.
Guide_Check_3 = 3. Map Brand value help from WRF_BRANDS to valid hierarchy node at hierarchy L2.
Guide_Check_4 = 4. Implement server-side authorization, optimistic locking, overlapping-validity checks and duplicate protection on CampaignPricingRecords POST (the UI no longer checks them), pricing unit/currency validation and error/retry behavior.
Guide_Check_5 = 5. Maintain Campaign-to-Condition Record linkage (including SAP KNUMH), audit trail and status; ensure Draft/Active statuses do not imply pricing is inactive unless the backend enforces it.
Guide_Check_6 = 6. Confirm the fallback condition table 949 and the EUR / 1 PC defaults for percentage types against S/4 customizing, and maintain the Axxx table numbers in the configuration so the fallback is not needed.

