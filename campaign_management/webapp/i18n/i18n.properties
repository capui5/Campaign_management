# Overview & flow
Nav_Overview = Overview & Flow
Overview_Title = Campaign & Sales Pricing
Overview_Lead = Create campaigns in S/4, maintain campaign pricing conditions as drafts, post them to S/4 as condition records and administer the Axxx key-combination mapping.
Overview_Configured = Configured combinations
Overview_Process = End-to-end process
Overview_Step_1 = 1. Create campaign
Overview_Step_1_Sub = Description + country, saved to S/4 (ZSDGW_CE_APP_SRV)
Overview_Step_2 = 2. Generate ID
Overview_Step_2_Sub = S/4 returns the Campaign ID (ZZCAMPAIGN)
Overview_Step_3 = 3. Add to draft
Overview_Step_3_Sub = ZSRP / ZVHR / ZCVO / ZPWP / ZPW1 stored as DRAFT in CAP
Overview_Step_4 = 4. Save to S/4
Overview_Step_4_Sub = A_SlsPrcgConditionRecord; record POSTED (KNUMH) or FAILED
Overview_Open_Pricing = Open Pricing Maintenance
Overview_Principles = Design principles
Overview_Principles_Text = Distribution Channel is always the DIST_CHANNEL business key default (10) and Hierarchy the HIERARCHY default (L2) for brand combinations; neither can be changed. "Add to Draft" checks only the entered fields and sends the record to the backend; duplicate keys and overlapping validity are checked by the backend, and its message is shown as returned. "Save to S/4" sends the condition table from the Axxx configuration (949 when none is maintained); percentage types are sent with currency EUR and quantity 1 PC. Axxx numbers must match S/4 customizing.

