<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campaign & Pricing Management | UI Prototype</title><style>
:root{--blue:#0866b1;--nav:#102c48;--bg:#f3f6f9;--line:#dce3eb;--muted:#667789;--text:#1d3044;--green:#17774c;--orange:#a35b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px '72','Segoe UI',Arial,sans-serif}header{height:58px;background:var(--nav);color:white;display:flex;align-items:center;gap:16px;padding:0 25px}header strong{font-size:17px}header small{color:#bbcfdf;margin-left:auto}.shell{display:flex;min-height:calc(100vh - 58px)}nav{width:232px;background:#fff;border-right:1px solid var(--line);padding:22px 12px}nav .navhead{color:#8a98a5;font-size:11px;letter-spacing:1px;font-weight:700;padding:5px 13px 15px}nav button{display:block;width:100%;border:0;background:none;text-align:left;padding:13px 14px;margin-bottom:5px;border-radius:6px;color:#35506b;cursor:pointer;font-size:14px}nav button.active{background:#e6f2fc;color:#005b9f;font-weight:700}nav button:hover{background:#eef5fb}main{flex:1;min-width:0;padding:28px 34px;max-width:1500px}.crumb{color:var(--muted);font-size:12px;margin-bottom:8px}h1{font-size:25px;margin:0 0 8px;font-weight:650}h2{font-size:17px;margin:0 0 15px}p.lead{color:var(--muted);margin:0 0 24px}.card{background:white;border:1px solid var(--line);border-radius:9px;box-shadow:0 2px 8px #17365308;margin-bottom:19px;padding:22px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.toolbar h2{margin:0}.btn{border:1px solid #c7d4e1;border-radius:5px;background:#fff;color:#24516f;padding:9px 14px;cursor:pointer;font-weight:600}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.positive{background:var(--green);border-color:var(--green);color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.btn:hover:not(:disabled){filter:brightness(.96)}.btn.tiny{padding:5px 9px;font-size:12px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field.wide{grid-column:span 2}.field.full{grid-column:1/-1}label{font-size:12px;color:#52677c;font-weight:650}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #bccbd9;border-radius:5px;font:inherit;color:var(--text);background:#fff}input:disabled{background:#f0f4f7;color:#65798b}textarea{min-height:80px;resize:vertical}.required:after{content:' *';color:#bb3a3a}.pill{display:inline-block;background:#edf2f6;border-radius:20px;padding:5px 10px;font-size:12px;color:#47617a}.pill.green{background:#e4f5ed;color:#116b43}.pill.orange{background:#fff2df;color:#8e5700}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;background:#f2f6f9;color:#526a7d;font-weight:650;padding:11px;border-bottom:1px solid var(--line)}td{padding:12px 11px;border-bottom:1px solid #e8edf2;vertical-align:middle}tr:hover td{background:#fafcfe}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 16px;cursor:pointer;color:#57718a}.tab.active{border-bottom-color:var(--blue);color:var(--blue);font-weight:700}.steps{display:flex;gap:8px;margin:20px 0}.step{flex:1;border:1px solid #d2dfeb;background:white;padding:12px;border-radius:7px;text-align:center;font-size:12px;color:#607489}.step.done{background:#e7f5ee;border-color:#9acdb3;color:#17633d}.step.current{background:#e8f3fc;border-color:#6aaee1;color:#075d9d;font-weight:700}.hint{background:#eef7ff;border-left:3px solid #2888c9;padding:11px 14px;color:#3a5c77;border-radius:3px;font-size:13px;margin:13px 0}.warning{background:#fff8e9;border-left:3px solid #d49a2b;padding:11px 14px;color:#765a23;margin:12px 0}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.empty{text-align:center;padding:32px;color:#8090a1}.small{font-size:12px;color:var(--muted)}.metric{padding:18px;background:white;border:1px solid var(--line);border-radius:8px;flex:1}.metric strong{font-size:24px;display:block;margin-top:5px}.radioCards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.radioCards label{border:1px solid var(--line);border-radius:6px;padding:12px;font-size:13px;cursor:pointer;color:var(--text)}.radioCards label:has(input:checked){border-color:#2988c7;background:#edf7ff}.radioCards input{width:auto;margin-right:8px}.flow{display:flex;gap:8px;align-items:stretch}.flow div{flex:1;background:#eff6fb;border:1px solid #cfe2f0;padding:16px;border-radius:6px;text-align:center}.flow span{align-self:center;color:#678}footer{padding:16px 32px;color:#8493a1;font-size:12px}.toast{position:fixed;bottom:25px;right:24px;background:#183d5c;color:white;padding:13px 18px;border-radius:6px;box-shadow:0 4px 20px #0003;display:none;max-width:400px;z-index:10}.muted{color:var(--muted)}.code{font-family:Consolas,monospace;color:#205a85}.scroll{overflow:auto}@media(max-width:950px){nav{width:170px}main{padding:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.flow{flex-direction:column}.flow span{transform:rotate(90deg)}}@media(max-width:640px){.shell{display:block}nav{width:auto;display:flex;overflow:auto;padding:8px}nav .navhead{display:none}nav button{white-space:nowrap}.grid{grid-template-columns:1fr}.field.wide{grid-column:auto}.radioCards{grid-template-columns:1fr}}
</style></head><body><header><strong>◈ Campaign & Pricing Management</strong><span class="pill">SAP BTP / S/4HANA RISE</span><small>Interactive developer reference · v1.1</small></header><div class="shell"><nav><div class="navhead">APPLICATION</div><button data-nav="dashboard" class="active">▦ &nbsp; Overview & Flow</button><button data-nav="campaigns">▤ &nbsp; Campaigns</button><button data-nav="pricing">％ &nbsp; Pricing Conditions</button><div class="navhead" style="padding-top:20px">ADMINISTRATION</div><button data-nav="config">⚙ &nbsp; Axxx Configuration</button><button data-nav="guide">ⓘ &nbsp; Developer Guide</button></nav><main id="main"></main></div><footer>Standalone HTML prototype · All records are sample data and changes are stored only in this browser session · No SAP posting</footer><div id="toast" class="toast"></div><script>
const COMBS={KC01:{name:'Campaign / Customer / Article',fields:['customer','article']},KC02:{name:'Campaign / Article',fields:['article']},KC03:{name:'Campaign / Brand',fields:['brand']},KC04:{name:'Campaign / Brand / Customer',fields:['brand','customer']},KC05:{name:'Campaign / Customer',fields:['customer']},KC06:{name:'Campaign only',fields:[]}};
const TYPES={ZSRP:{name:'Special Price',keys:['KC01','KC02'],kind:'amount'},ZVHR:{name:'Item Amount Discount',keys:['KC01','KC02','KC03','KC04','KC05'],kind:'amount'},ZPWP:{name:'Item % Discount',keys:['KC01','KC02','KC03','KC04','KC05'],kind:'percent'},ZPW1:{name:'Header % Discount',keys:['KC01','KC02','KC03','KC04','KC05'],kind:'percent'},ZCVO:{name:'Header Amount Discount',keys:['KC03','KC05','KC06'],kind:'amount'}};
let campaigns=[{id:'C-00001232',desc:'Dyson Special Trade 30% Off Campaign (Item Level)',country:'MY',status:'Draft',created:'2026-10-22'},{id:'C-00001231',desc:'Holiday Retail Campaign',country:'SG',status:'Active',created:'2026-10-20'},{id:'C-00001230',desc:'Brand Voucher Promotion',country:'TH',status:'Draft',created:'2026-10-18'}];
let configs=Object.entries(TYPES).flatMap(([type,t])=>t.keys.map((key,i)=>({type,key,table:'',active:true,default:i===0})));let conditions=[{campaign:'C-00001232',type:'ZPWP',key:'KC02',sales:'MY01',channel:'10',article:'SKU-10001',brand:'',customer:'',value:'30',currency:'%',from:'2026-11-01',to:'2026-11-30',status:'Draft'}];let page='dashboard',current='C-00001232',tab='general',edit=false,filter='',filterCountry='',pricingType='ZPWP',pricingKey='KC02';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const inp=(id,label,value='',extra='',type='text')=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`;const sel=(id,label,options,value)=>`<div class="field"><label for="${id}">${label}</label><select id="${id}">${options.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`;function notify(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3300)}function navigate(p){page=p;render()}function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));({dashboard:dashboard,campaigns:campaignPage,pricing:pricingPage,config:configPage,guide:guidePage})[page]()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));
function dashboard(){$('main').innerHTML=`<div class="crumb">Campaign Management / Overview</div><h1>Campaign & Sales Pricing</h1><p class="lead">Create campaigns, maintain VK11-equivalent condition records, and administer key-combination mappings.</p><div class="row" style="margin-bottom:20px"><div class="metric">Campaigns<strong>${campaigns.length}</strong></div><div class="metric">Condition records<strong>${conditions.length}</strong></div><div class="metric">Configured combinations<strong>${configs.filter(x=>x.active).length} / 20</strong></div></div><div class="card"><h2>End-to-end process</h2><div class="flow"><div><b>1. Create campaign</b><p class="small">Description + user country</p></div><span>➜</span><div><b>2. Generate ID</b><p class="small">ZCAMPAIGN in S/4</p></div><span>➜</span><div><b>3. Maintain conditions</b><p class="small">ZSRP / ZVHR / ZCVO / ZPWP / ZPW1</p></div><span>➜</span><div><b>4. Validate & post</b><p class="small">Pricing API + linkage</p></div></div><div class="actions"><button class="btn primary" onclick="newCampaign()">+ Create Campaign</button><button class="btn" onclick="navigate('pricing')">Open Pricing Maintenance →</button></div></div><div class="card"><h2>Design principles</h2><div class="hint">Campaign ID and pricing ID are identical business values. Distribution Channel defaults to <b>10</b>; hierarchy defaults to <b>L2</b>; brand value help comes from <b>WRF_BRANDS</b>. Actual Axxx numbers are maintained in administrator configuration and must be validated against S/4 customizing.</div><p class="small">Sample records, mock-generated IDs and draft changes are only illustrative. Actual campaign numbering, save, authorizations and condition-record creation must run in S/4HANA.</p></div>`}
function campaignPage(){let filtered=campaigns.filter(c=>(!filter||[c.id,c.desc].join(' ').toLowerCase().includes(filter.toLowerCase()))&&(!filterCountry||c.country===filterCountry));$('main').innerHTML=`<div class="crumb">Campaign Management / Campaigns</div><div class="toolbar"><div><h1>Campaigns</h1><p class="lead">Search, create, change and display campaign master data.</p></div><button class="btn primary" onclick="newCampaign()">+ Create Campaign</button></div><div class="card"><div class="grid">${inp('search','Campaign ID / Description',filter,'oninput="filter=this.value;campaignPage()"')}${sel('countryFilter','Country',[['','All countries'],['MY','Malaysia'],['SG','Singapore'],['TH','Thailand'],['ID','Indonesia'],['VN','Vietnam']],filterCountry)}</div><div class="actions"><button class="btn" onclick="filter='';filterCountry='';campaignPage()">Clear Filters</button><button class="btn primary" onclick="filterCountry=$('countryFilter').value;campaignPage()">Search</button></div></div><div class="card scroll"><table><thead><tr><th>Campaign ID</th><th>Description</th><th>Country</th><th>Created</th><th>Status</th><th>Actions</th></tr></thead><tbody>${filtered.map(c=>`<tr><td class="code">${esc(c.id)}</td><td>${esc(c.desc)}</td><td>${c.country}</td><td>${c.created}</td><td><span class="pill ${c.status==='Active'?'green':'orange'}">${c.status}</span></td><td><button class="btn tiny" onclick="openCampaign('${c.id}',false)">Display</button> <button class="btn tiny" onclick="openCampaign('${c.id}',true)">Change</button> <button class="btn tiny" onclick="current='${c.id}';navigate('pricing')">Pricing</button></td></tr>`).join('')}</tbody></table>${!filtered.length?'<div class="empty">No campaigns found</div>':''}</div>`}
function newCampaign(){current=null;edit=true;tab='general';detailPage()}function openCampaign(id,change){current=id;edit=change;tab='general';detailPage()}
function detailPage(){page='campaigns';let c=campaigns.find(x=>x.id===current);$('main').innerHTML=`<div class="crumb"><a href="#" onclick="event.preventDefault();navigate('campaigns')">Campaigns</a> / ${c?'Campaign Details':'Create Campaign'}</div><div class="toolbar"><h1>${c?esc(c.id):'Create Campaign'}</h1><span class="pill ${c?.status==='Active'?'green':'orange'}">${c?.status||'New'}</span></div><div class="steps"><div class="step ${c?'done':'current'}">1 · Campaign Details</div><div class="step ${c?'current':''}">2 · Pricing Conditions</div><div class="step">3 · Validate & Activate</div></div><div class="card"><div class="tabs"><button class="tab ${tab==='general'?'active':''}" onclick="tab='general';detailPage()">General Information</button><button class="tab ${tab==='pricing'?'active':''}" onclick="tab='pricing';detailPage()">Pricing Conditions</button><button class="tab ${tab==='history'?'active':''}" onclick="tab='history';detailPage()">History</button></div>${tab==='general'?`<div class="grid">${inp('campId','Campaign ID',c?.id||'Auto-generated by S/4','disabled')}<div class="field wide"><label class="required">Description</label><input id="campDesc" value="${esc(c?.desc||'')}" ${edit?'':'disabled'}></div>${sel('campCountry','Country',[['MY','Malaysia (MY)'],['SG','Singapore (SG)'],['TH','Thailand (TH)'],['ID','Indonesia (ID)'],['VN','Vietnam (VN)']],c?.country||'MY')}${inp('created','Created On',c?.created||'System date','disabled')}</div><div class="hint">Country defaults from the authenticated user's country mapping, and can be changed subject to authorization. The demo defaults to MY.</div><div class="actions"><button class="btn" onclick="navigate('campaigns')">Back</button>${edit?`<button class="btn primary" onclick="saveCampaign()">Save Campaign</button>`:c?`<button class="btn" onclick="edit=true;detailPage()">Change</button>`:''}</div>`:tab==='pricing'?`<p>Condition records linked to this campaign.</p>${conditionTable(conditions.filter(x=>x.campaign===current))}<div class="actions"><button class="btn primary" onclick="navigate('pricing')">+ Maintain Pricing Conditions</button></div>`:`<div class="empty">Audit history will be read from S/4 change documents and campaign pricing logs.</div>`}</div>`;if(!edit&&$('campCountry'))$('campCountry').disabled=true}
function saveCampaign(){let d=$('campDesc').value.trim(),country=$('campCountry').value;if(!d)return notify('Campaign description is mandatory');if(!current){let id='C-'+String(1233+campaigns.length-3).padStart(8,'0');campaigns.unshift({id,desc:d,country,status:'Draft',created:new Date().toISOString().slice(0,10)});current=id;notify('Demo campaign created: '+id+' (not saved to SAP)')}else{let c=campaigns.find(x=>x.id===current);c.desc=d;c.country=country;notify('Demo campaign updated (not saved to SAP)')}edit=false;detailPage()}
function conditionTable(items){return `<div class="scroll"><table><thead><tr><th>Campaign</th><th>Type</th><th>Combination</th><th>Scope</th><th>Value</th><th>Validity</th><th>Status</th></tr></thead><tbody>${items.map(x=>`<tr><td class="code">${esc(x.campaign)}</td><td>${x.type}</td><td>${x.key} · ${esc(COMBS[x.key].name)}</td><td>${esc(x.brand||x.article||x.customer||'Campaign')}</td><td>${esc(x.value)} ${esc(x.currency)}</td><td>${x.from} → ${x.to}</td><td><span class="pill orange">${x.status}</span></td></tr>`).join('')}</tbody></table>${items.length?'':'<div class="empty">No pricing conditions yet</div>'}</div>`}
function pricingPage(){if(!current)current=campaigns[0].id;let keys=TYPES[pricingType].keys;if(!keys.includes(pricingKey))pricingKey=keys[0];let fields=COMBS[pricingKey].fields;let cfg=configs.find(x=>x.type===pricingType&&x.key===pricingKey);$('main').innerHTML=`<div class="crumb">Campaign Management / Pricing Conditions</div><h1>Maintain Sales Pricing Conditions</h1><p class="lead">VK11-equivalent condition maintenance, linked to the selected campaign.</p><div class="card"><h2>1. Select Campaign & Condition Type</h2><div class="grid">${sel('campaignPick','Campaign',campaigns.map(c=>[c.id,c.id+' — '+c.desc.slice(0,28)]),current)}${sel('typePick','Condition Type',Object.entries(TYPES).map(([k,v])=>[k,k+' — '+v.name]),pricingType)}${inp('tableNo','Configured Condition Table',cfg?.table?'A'+cfg.table:'Not configured','disabled')}</div><div class="hint">The technical ID/Campaign fields are the same business Campaign ID. The backend maps the value to the exact condition-table DDIC key.</div></div><div class="card"><h2>2. Select Key Combination</h2><div class="radioCards">${keys.map(k=>`<label><input type="radio" name="key" value="${k}" ${pricingKey===k?'checked':''} onchange="pricingKey=this.value;pricingPage()">${k} · ${COMBS[k].name}</label>`).join('')}</div></div><div class="card"><h2>3. Maintain Condition Details</h2><div class="grid">${inp('salesOrg','Sales Organization','MY01')}${inp('distChannel','Distribution Channel','10')}${inp('campaignId','Campaign ID',current,'disabled')}${fields.includes('brand')?`${inp('hierarchy','Hierarchy','L2','disabled')}${sel('brand','Brand (WRF_BRANDS)',[['','Select brand'],['DYSON','DYSON'],['SKII','SK-II'],['BEAUTY','Beauty Brand — sample']],'')}`:''}${fields.includes('customer')?inp('customer','Customer',''):''}${fields.includes('article')?inp('article','Article / SKU',''):''}${inp('from','Valid From','2026-11-01','','date')}${inp('to','Valid To','2026-11-30','','date')}${inp('amount',TYPES[pricingType].kind==='percent'?'Discount Percentage':'Condition Amount','30','','number')}${inp('currency',TYPES[pricingType].kind==='percent'?'Unit':'Currency',TYPES[pricingType].kind==='percent'?'%':'MYR','disabled')}</div>${!cfg?.table?'<div class="warning">Axxx mapping is not configured. In production, backend posting must be blocked until a valid, active mapping is maintained and verified against S/4 pricing customizing.</div>':''}<div class="actions"><button class="btn" onclick="navigate('config')">View Configuration</button><button class="btn primary" onclick="addCondition()">+ Add Demo Draft</button></div></div><div class="card"><div class="toolbar"><h2>4. Campaign Pricing Records</h2><button class="btn positive" onclick="notify('Simulation only: SAP validation / activation is not connected')">Validate & Activate (Demo)</button></div>${conditionTable(conditions.filter(x=>x.campaign===current))}</div>`;$('campaignPick').onchange=e=>{current=e.target.value;pricingPage()};$('typePick').onchange=e=>{pricingType=e.target.value;pricingKey=TYPES[pricingType].keys[0];pricingPage()}}
function addCondition(){let fields=COMBS[pricingKey].fields;for(let f of ['salesOrg','distChannel','from','to','amount',...fields])if(!$(f)?.value.trim())return notify('Required field missing: '+f);if($('from').value>$('to').value)return notify('Valid From cannot exceed Valid To');conditions.push({campaign:current,type:pricingType,key:pricingKey,sales:$('salesOrg').value,channel:$('distChannel').value,article:$('article')?.value||'',brand:$('brand')?.value||'',customer:$('customer')?.value||'',value:$('amount').value,currency:TYPES[pricingType].kind==='percent'?'%':'MYR',from:$('from').value,to:$('to').value,status:'Draft'});notify('Demo draft condition added (not posted to SAP)');pricingPage()}
function configPage(){$('main').innerHTML=`<div class="crumb">Administration / Pricing Key Configuration</div><h1>Condition Table (Axxx) Mapping</h1><p class="lead">Maintain the 20 approved condition-type/key-combination assignments. IT/SD administrator function.</p><div class="warning">Illustrative local editor. S/4 backend must validate table existence, access sequence membership, key fields and user authorization before allowing configuration activation. Never update Axxx/KONH/KONP directly.</div><div class="card"><div class="toolbar"><h2>Configuration Matrix</h2><div class="row"><button class="btn" onclick="downloadConfig()">Export JSON</button><button class="btn primary" onclick="notify('Demo mappings updated locally; no SAP save performed')">Save Demo Mapping</button></div></div><div class="scroll"><table><thead><tr><th>Condition Type</th><th>Combination</th><th>Business Key</th><th>Table Number</th><th>Derived Table</th><th>Default</th><th>Active</th></tr></thead><tbody>${configs.map((c,i)=>`<tr><td><b>${c.type}</b></td><td>${c.key}</td><td>${COMBS[c.key].name}</td><td><input style="width:86px" maxlength="3" placeholder="###" value="${esc(c.table)}" oninput="setConfig(${i},this.value)"></td><td class="code" id="table${i}">${c.table?'A'+c.table:'—'}</td><td><input style="width:auto" type="checkbox" ${c.default?'checked':''} onchange="setDefault(${i},this.checked)"></td><td><input style="width:auto" type="checkbox" ${c.active?'checked':''} onchange="configs[${i}].active=this.checked"></td></tr>`).join('')}</tbody></table></div></div><div class="card"><h2>Proposed Backend Configuration Objects</h2><p><span class="code">ZSD_CAMP_CONFC</span> — Condition Type + Combination ID + Condition Table Number + Active/Default indicators.</p><p><span class="code">ZSD_CAMP_CONF_F</span> — Optional technical field mapping, visibility and input rules for dynamic UI.</p><p class="small">Production changes should be authorized, logged and transported or controlled under an approved configuration governance process.</p></div>`}
function setConfig(i,v){configs[i].table=v.replace(/\D/g,'').slice(0,3);$('table'+i).textContent=configs[i].table?'A'+configs[i].table:'—'}function setDefault(i,on){if(on)configs.forEach((c,j)=>{if(c.type===configs[i].type)c.default=j===i});else configs[i].default=false;configPage()}function downloadConfig(){let blob=new Blob([JSON.stringify(configs,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='campaign_condition_mapping_demo.json';a.click();URL.revokeObjectURL(url)}
function guidePage(){$('main').innerHTML=`<div class="crumb">Developer Reference / Implementation Guide</div><h1>Screen Flow & Service Boundaries</h1><p class="lead">Reference for SAPUI5 frontend, RAP backend and SD pricing developers.</p><div class="card"><h2>Application Navigation</h2><div class="flow"><div>Campaign List<br><span class="small">Search / Create / Change / Display</span></div><span>➜</span><div>Campaign Detail<br><span class="small">Generate S/4 Campaign ID</span></div><span>➜</span><div>Pricing Conditions<br><span class="small">Dynamic keys + validity</span></div><span>➜</span><div>Review / Activate<br><span class="small">Validate S/4 results</span></div></div></div><div class="card"><h2>Proposed OData service contracts</h2><table><tr><th>Service</th><th>Operation</th><th>Purpose</th></tr><tr><td class="code">ZUI_CAMPAIGN_MGMT</td><td>GET / POST / PATCH</td><td>Campaign master CRUD (no physical deletion)</td></tr><tr><td class="code">ZUI_CAMP_PRICING</td><td>GET / POST / PATCH</td><td>Condition draft, validation and save via supported pricing API</td></tr><tr><td class="code">ZUI_CAMP_CONFIG</td><td>GET / PATCH</td><td>Approved Axxx configuration and dynamic field definitions</td></tr><tr><td class="code">ZUI_CAMP_VALUEHELP</td><td>GET</td><td>Brand from WRF_BRANDS, customer, article and sales organization helps</td></tr></table></div><div class="card"><h2>Developer checkpoints</h2><p>1. Verify actual Axxx numbers and DDIC key fields for all 20 mappings. Confirm Campaign/ID technical key equivalence.</p><p>2. Confirm condition type configuration and supported S/4 pricing API, especially ZPW1 and ZCVO header discount behavior.</p><p>3. Map Brand value help from WRF_BRANDS to valid hierarchy node at hierarchy L2.</p><p>4. Implement server-side authorization, optimistic locking, overlapping-validity checks, duplicate protection, pricing unit/currency validation and error/retry behavior.</p><p>5. Maintain Campaign-to-Condition Record linkage (including SAP KNUMH), audit trail and status; ensure Draft/Active statuses do not imply pricing is inactive unless the backend enforces it.</p><p>6. Replace sample lists and browser-only draft behavior with authenticated OData V4 bindings and backend-generated campaign IDs.</p></div>`}render();
</script></body></html>
